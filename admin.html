<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração — Poker de Quinta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Poker de Quinta · Temporada 2027</p>
        <h1>Área administrativa</h1>
        <p>Gerencie jogadores, etapas e informações privadas da organização.</p>
      </div>

      <button class="btn btn--ghost" id="admin-logout" type="button" hidden>
        Sair
      </button>
    </header>

    <section class="admin-card" id="admin-login-card">
      <h2>Entrar</h2>
      <p>Somente administradores autorizados podem acessar estas informações.</p>

      <form id="admin-login-form">
        <label>
          E-mail
          <input id="admin-email" type="email" autocomplete="username" required>
        </label>

        <label>
          Senha
          <input id="admin-password" type="password" autocomplete="current-password" required>
        </label>

        <button class="btn btn--primary" type="submit">
          Entrar
        </button>

        <p class="form-message" id="admin-login-message" role="alert"></p>
      </form>
    </section>

    <section id="admin-content" hidden>
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab is-active" type="button" data-admin-tab="config">
          Temporada
        </button>

        <button class="admin-tab" type="button" data-admin-tab="player">
          Jogadores
        </button>

        <button class="admin-tab" type="button" data-admin-tab="stage">
          Etapas
        </button>
      </div>

      <section class="admin-panel is-active" data-admin-panel="config">
        <div class="admin-card">
          <h2>Configurações da temporada</h2>

          <form id="season-config-form">
            <label>
              Próxima etapa
              <input id="config-next-stage" type="number" min="1" max="13" required>
            </label>

            <label>
              Etapa do ranking atualizado
              <input id="config-ranking-stage" type="number" min="1" max="13" required>
            </label>

            <label>
              Data do evento
              <input id="config-event-date" type="datetime-local">
            </label>

            <label class="checkbox-field">
              <input id="config-open" type="checkbox">
              Inscrições abertas
            </label>

            <button class="btn btn--primary" type="submit">
              Salvar configurações
            </button>
          </form>
        </div>
      </section>

      <section class="admin-panel" data-admin-panel="player" hidden>
        <div class="admin-card">
          <h2>Cadastro de jogador</h2>

          <form id="player-form">
            <label>
              ID do jogador
              <input id="player-id" type="text" placeholder="ex.: eduardo">
            </label>

            <label>
              Nome
              <input id="player-name" type="text" required>
            </label>

            <label>
              Apelido
              <input id="player-nickname" type="text">
            </label>

            <label>
              Cidade
              <input id="player-city" type="text">
            </label>

            <label>
              UF
              <input id="player-uf" type="text" maxlength="2">
            </label>

            <label>
              Foto
              <input id="player-photo" type="url" placeholder="https://...">
            </label>

            <label>
              Descrição
              <textarea id="player-bio" rows="4"></textarea>
            </label>

            <label>
              Observações administrativas
              <textarea id="player-notes" rows="4"></textarea>
            </label>

            <label>
              Chave PIX
              <input id="player-pix" type="text" autocomplete="off">
            </label>

            <button class="btn btn--primary" type="submit">
              Salvar jogador
            </button>

            <p class="form-message" id="player-message" role="status"></p>
          </form>
        </div>
      </section>

      <section class="admin-panel" data-admin-panel="stage" hidden>
        <div class="admin-card">
          <h2>Resultado da etapa</h2>

          <form id="stage-form">
            <label>
              Número da etapa
              <input id="stage-id" type="number" min="1" max="13" required>
            </label>

            <label>
              Data e horário
              <input id="stage-date" type="datetime-local" required>
            </label>

            <label>
              Status
              <select id="stage-status">
                <option value="upcoming">Em breve</option>
                <option value="next">Próxima etapa</option>
                <option value="completed">Concluída</option>
                <option value="final">Grande final</option>
              </select>
            </label>

            <label>
              IDs dos jogadores, na ordem de classificação
              <textarea id="stage-results" rows="4" placeholder="eduardo, joao, maria"></textarea>
            </label>

            <label>
              Campeão da etapa — ID
              <input id="stage-champion" type="text">
            </label>

            <label>
              Matador de KO — ID
              <input id="stage-ko-killer" type="text">
            </label>

            <label>
              Mão da Etapa
              <input id="stage-hand-of-stage" type="text" placeholder="Ex.: 7 de copas">
            </label>

            <label>
              Vencedor da Mão da Etapa — ID
              <input id="stage-hand-winner" type="text">
            </label>

            <label>
              Melhor Mão da Noite — descrição
              <input id="stage-best-hand" type="text">
            </label>

            <label>
              Ganhador da Melhor Mão — ID
              <input id="stage-best-hand-winner" type="text">
            </label>

            <label>
              Ganhadores da Roleta da Sorte
            </label>

            <textarea
              id="stage-roulette"
              rows="5"
              placeholder='[{"playerId":"eduardo","motivo":"perdeu-com-AA","giros":1}]'
            ></textarea>

            <label>
              Desafio do JJ — bolha da premiação
              <input id="stage-jj-bubble" type="text">
            </label>

            <label>
              Resultado do Desafio do JJ
              <select id="stage-jj-result">
                <option value="">Não definido</option>
                <option value="venceu">Bolha venceu</option>
                <option value="perdeu">Bolha perdeu</option>
              </select>
            </label>

            <label>
              Valor acumulado para a próxima etapa
              <input id="stage-jj-amount" type="number" min="0" step="100" value="0">
            </label>

            <button class="btn btn--primary" type="submit">
              Salvar etapa
            </button>

            <p class="form-message" id="stage-message" role="status"></p>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
